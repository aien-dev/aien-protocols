[workspace]
resolver = "2"
members = [
    "crates/aien-protocol-types",
    "crates/aien-agent-state-abi",
    "crates/aien-inference-protocol",
    "crates/aien-inference-client",
    "crates/aien-action-protocol",
    "crates/aien-event-protocol",
    "crates/aien-evaluation-protocol",
    "crates/aien-provenance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aien-dev/aien-protocols"
authors = ["AIEN Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.37", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
bitflags = { version = "2.5", features = ["serde"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
